{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <nav class="main-nav">
        <a href="{% url 'mainhome' %}">Home</a>
        <a href="{% url 'app1_home' %}">App1 Home</a>
        <a href="{% url 'app1_about' %}">App1 About</a>
        <a href="{% url 'app1_contact' %}">App1 Contact</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
